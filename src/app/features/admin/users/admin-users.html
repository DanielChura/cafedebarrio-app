<div class="flex flex-col gap-8">
  <div class="flex flex-col gap-1">
    <p class="text-xl text-neutral-900">Usuarios</p>
    <p class="text-sm text-neutral-500">{{ items().length }} en total</p>
  </div>

  @if (loading()) {
    <p class="text-sm text-neutral-500">Cargando...</p>
  } @else {
    <div class="rounded-2xl border border-neutral-200 bg-white p-6">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-neutral-500">
            <td class="pb-4">Nombre</td>
            <td class="pb-4">Email</td>
            <td class="pb-4">Rol</td>
            <td class="pb-4 text-right">Acciones</td>
          </tr>
        </thead>
        <tbody>
          @for (item of items(); track item.id) {
            <tr class="border-t border-neutral-200 text-neutral-900">
              <td class="py-4">{{ item.name }}</td>
              <td class="py-4 text-neutral-500">{{ item.email }}</td>
              <td class="py-4 text-neutral-500">{{ item.role }}</td>
              <td class="py-4 text-right">
                <button (click)="remove(item.id)" class="text-sm text-orange-500">Eliminar</button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td class="py-4 text-sm text-neutral-500">Sin usuarios.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
