<aside
  class="flex w-full flex-col gap-8 border-b border-neutral-200 bg-white p-2 md:min-h-screen md:w-60 md:border-b-0 md:border-r md:p-4"
>
  <a routerLink="/" class="flex items-center gap-4">
    <img src="/logo.png" alt="Café de Barrio" class="h-16 w-auto object-contain" />
  </a>
  <nav class="flex grow gap-4 md:flex-col">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="bg-orange-500 text-white hover:bg-orange-500"
        class="flex items-center gap-2 rounded-2xl px-4 py-3 text-sm text-neutral-500 hover:bg-neutral-50"
      >
        <ng-container *ngComponentOutlet="link.icon" />
        {{ link.label }}
      </a>
    }
  </nav>
  <a routerLink="/" class="rounded-2xl bg-neutral-50 p-4 text-sm text-neutral-500">
    Volver a la tienda
  </a>
</aside>
