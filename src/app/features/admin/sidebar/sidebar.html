<aside
  class="flex w-full flex-col gap-8 border-b border-neutral-200 bg-white p-4 fixed md:top-0 md:h-screen md:w-60 md:border-b-0 md:border-r"
>
  <a routerLink="/" class="flex cursor-pointer items-center gap-4 p-2 text-green-800">
    <app-logo-icon /> TechStore Pro
  </a>
  <nav class="flex grow flex-col gap-2">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="bg-green-800 text-white hover:text-white"
        class="flex cursor-pointer items-center gap-3 rounded-xl px-4 py-3 text-sm text-neutral-600 hover:text-neutral-800"
      >
        <ng-container *ngComponentOutlet="link.icon" />
        {{ link.label }}
      </a>
    }
  </nav>
  <a
    routerLink="/"
    class="flex cursor-pointer items-center gap-3 rounded-xl bg-neutral-50 p-4 text-center text-sm text-neutral-600 hover:text-neutral-800"
  >
    <app-exit-icon />
    Volver a la tienda
  </a>
</aside>
