<aside
  class="flex w-full flex-col gap-8 border-b border-neutral-200 bg-white p-6 md:min-h-screen md:w-60 md:border-b-0 md:border-r md:p-8"
>
  <a routerLink="/" class="flex items-center gap-4">
    <img src="/logo.png" alt="Café de Barrio" class="h-10 w-auto object-contain" />
    <span class="flex flex-col">
      <span class="text-base text-neutral-900">Café de Barrio</span>
      <span class="text-sm text-neutral-500">Panel admin</span>
    </span>
  </a>
  <nav class="flex grow gap-2 md:flex-col">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="bg-orange-500 text-white"
        class="rounded-2xl p-4 text-sm text-neutral-500"
      >
        {{ link.label }}
      </a>
    }
  </nav>
  <a routerLink="/" class="rounded-2xl border-t border-neutral-200 p-4 text-sm text-neutral-500">
    Volver a la tienda
  </a>
</aside>
