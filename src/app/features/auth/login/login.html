<main class="flex w-full grow items-center justify-center bg-orange-500 min-h-screen px-4 py-16">
  <section
      aria-labelledby="login-title"
      class="w-full max-w-sm bg-white rounded-2xl p-8 flex flex-col gap-6"
    >
      <div class="flex flex-col gap-2">
        <h1 id="login-title" class="text-2xl text-neutral-900">Iniciar sesión</h1>
        <p class="text-sm text-neutral-500">Bienvenido de vuelta a Café de Barrio.</p>
      </div>
      <form
        class="flex flex-col gap-4"
        (submit)="submit(email.value, password.value); $event.preventDefault()"
      >
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm text-neutral-900">Correo</label>
          <input
            #email
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="tu@correo.com"
            class="w-full bg-neutral-50 rounded-2xl px-4 py-2 text-sm text-neutral-900 placeholder:text-neutral-500"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label for="password" class="text-sm text-neutral-900">Contraseña</label>
          <input
            #password
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full bg-neutral-50 rounded-2xl px-4 py-2 text-sm text-neutral-900 placeholder:text-neutral-500"
          />
        </div>
        @if (error()) {
          <p role="alert" class="text-sm text-orange-500">{{ error() }}</p>
        }
        <button
          type="submit"
          class="w-full cursor-pointer rounded-2xl bg-orange-500 px-4 py-2 text-sm text-white"
        >
          Entrar
        </button>
      </form>
      <p class="text-sm text-neutral-500">
        ¿No tienes cuenta?
        <a routerLink="/register" class="text-orange-500">Regístrate</a>
      </p>
    </section>
</main>
