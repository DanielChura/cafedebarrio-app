<main class="flex w-full grow items-center justify-center bg-orange-500 min-h-screen px-4 py-16">
  <section
      aria-labelledby="register-title"
      class="w-full max-w-sm bg-white rounded-2xl p-8 flex flex-col gap-6"
    >
      <div class="flex flex-col gap-2">
        <h1 id="register-title" class="text-2xl text-neutral-900">Crear cuenta</h1>
        <p class="text-sm text-neutral-500">Únete a Café de Barrio y pide más rápido.</p>
      </div>
      <form
        class="flex flex-col gap-4"
        (submit)="submit(name.value, email.value, password.value); $event.preventDefault()"
      >
        <div class="flex flex-col gap-2">
          <label for="name" class="text-sm text-neutral-900">Nombre</label>
          <input
            #name
            id="name"
            name="name"
            type="text"
            required
            autocomplete="name"
            placeholder="Tu nombre"
            class="w-full bg-neutral-50 rounded-2xl px-4 py-2 text-sm text-neutral-900 placeholder:text-neutral-500"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm text-neutral-900">Correo</label>
          <input
            #email
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="tu@correo.com"
            class="w-full bg-neutral-50 rounded-2xl px-4 py-2 text-sm text-neutral-900 placeholder:text-neutral-500"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label for="password" class="text-sm text-neutral-900">Contraseña</label>
          <input
            #password
            id="password"
            name="password"
            type="password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="••••••••"
            class="w-full bg-neutral-50 rounded-2xl px-4 py-2 text-sm text-neutral-900 placeholder:text-neutral-500"
          />
        </div>
        @if (error()) {
          <p role="alert" class="text-sm text-orange-500">{{ error() }}</p>
        }
        <button
          type="submit"
          class="w-full cursor-pointer rounded-2xl bg-orange-500 px-4 py-2 text-sm text-white"
        >
          Registrarme
        </button>
      </form>
      <p class="text-sm text-neutral-500">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="text-orange-500">Inicia sesión</a>
      </p>
    </section>
</main>
