<div class="flex flex-col md:flex-row gap-8 py-4">
  <aside class="w-full md:w-60 shrink-0 flex flex-col gap-4">
    <div class="flex flex-col gap-1 px-2">
      <span class="text-xs text-neutral-500">{{ greeting() }}</span>
      <h2 class="text-lg text-neutral-900 truncate">{{ user()?.name }}</h2>
    </div>

    <nav class="flex flex-col gap-3">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-neutral-800 text-white hover:text-white"
          class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm text-neutral-500 hover:text-neutral-800"
        >
          <ng-container *ngComponentOutlet="link.icon" />
          <span>{{ link.label }}</span>
        </a>
      }

      <button
        type="button"
        (click)="logout()"
        class="flex w-full cursor-pointer items-center gap-3 rounded-lg px-4 py-3 text-left text-sm text-neutral-500 hover:text-red-400"
      >
        <ng-container *ngComponentOutlet="exitIcon" />
        <span>Cerrar sesión</span>
      </button>
    </nav>
  </aside>

  <section class="min-w-0 grow">
    <router-outlet />
  </section>
</div>
