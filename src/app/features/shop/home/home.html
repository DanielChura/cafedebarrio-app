<main class="flex flex-col gap-8">
  <app-promo-banner imageUrl="/banner.webp" alt="Disfruta de tu café en techstorepro" />

  <div class="flex gap-2 overflow-x-auto">
    @for (c of allCategories(); track c.id) {
      <a
        [routerLink]="['/catalog']"
        [queryParams]="{ category: c.id }"
        class="shrink-0 cursor-pointer rounded-xl bg-neutral-100 px-4 py-2 text-sm text-neutral-500"
      >
        {{ c.name }}
      </a>
    }
  </div>

  @for (c of allCategories(); track c.id) {
    <app-category-row [category]="c" />
  }
</main>
