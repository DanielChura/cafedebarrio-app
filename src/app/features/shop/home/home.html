<main class="flex flex-col gap-8">
  <div class="flex gap-2 overflow-x-auto scrollbar-none py-1">
    <a
      [routerLink]="['/catalog']"
      class="shrink-0 cursor-pointer capitalize rounded-lg px-4 py-2 text-sm bg-neutral-800 text-white"
    >
      Ver todo
    </a>
    @for (c of allCategories(); track c.id) {
      <a
        [routerLink]="['/catalog']"
        [queryParams]="{ category: c.id }"
        class="shrink-0 cursor-pointer capitalize rounded-lg px-4 py-2 text-sm bg-neutral-100 text-neutral-600"
      >
        {{ c.name }}
      </a>
    }
  </div>

  @for (c of allCategories(); track c.id) {
    <app-category-row [category]="c" />
  }
</main>
