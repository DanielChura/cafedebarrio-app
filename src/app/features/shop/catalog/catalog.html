<main class="flex flex-col gap-8 py-8">
  <div class="flex gap-2 overflow-x-auto scrollbar-none py-1">
    <button
      (click)="selectCategory(undefined)"
      class="shrink-0 cursor-pointer rounded-xl px-4 py-2 text-sm {{
        categoryId() === undefined ? 'bg-neutral-800 text-white' : 'bg-neutral-50 text-neutral-600'
      }}"
    >
      Todo
    </button>
    @for (category of allCategories(); track category.id) {
      <button
        (click)="selectCategory(category.id)"
        class="shrink-0 cursor-pointer rounded-xl px-4 py-2 text-sm {{
          categoryId() === category.id
            ? 'bg-neutral-800 text-white'
            : 'bg-neutral-50 text-neutral-600'
        }}"
      >
        {{ category.name }}
      </button>
    }
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
    @for (product of items(); track product.id) {
      <app-product-card [product]="product" />
    } @empty {
      @if (loading()) {
        <p class="text-sm text-neutral-600 col-span-full">Cargando productos...</p>
      } @else if (error()) {
        <p class="text-sm text-neutral-800 col-span-full">
          No pudimos cargar los productos. Revisa tu conexión e intenta de nuevo.
        </p>
      } @else {
        <p class="text-sm text-neutral-600 col-span-full">Sin resultados.</p>
      }
    }
  </div>
</main>
