<article class="flex flex-col gap-2">
  <a [routerLink]="['/product', product().id]" class="block">
    @if (product().imageUrl) {
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        class="w-full aspect-square object-cover rounded-xl bg-neutral-100"
      />
    } @else {
      <div class="w-full aspect-square rounded-2xl bg-neutral-100"></div>
    }
  </a>
  <div class="flex flex-col align-bottom gap-1">
    <a [routerLink]="['/product', product().id]">
      <h3 class="text-base text-neutral-900">{{ product().name }}</h3>
    </a>
    <div class="flex items-center justify-between gap-2">
      <p class="text-sm text-orange-500">
        {{ product().price | currency: 'PEN' : 'S/ ' : '1.2-2' }}
      </p>
      <button (click)="add()" class="cursor-pointer rounded-full bg-orange-500 p-1 text-white">
        <app-add-icon class="size-4" />
      </button>
    </div>
  </div>
</article>
