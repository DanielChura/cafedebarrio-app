<article class="flex flex-col gap-2">
  <a [routerLink]="['/product', product().id]" class="block">
    @if (product().imageUrl) {
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        class="w-full aspect-square object-cover rounded-2xl bg-neutral-50"
      />
    } @else {
      <div class="w-full aspect-square rounded-2xl bg-neutral-50"></div>
    }
  </a>
  <div class="flex flex-col gap-1">
    <a [routerLink]="['/product', product().id]">
      <h3 class="text-sm text-neutral-900">{{ product().name }}</h3>
    </a>
    @if (product().description) {
      <p class="text-sm text-neutral-500 line-clamp-1">{{ product().description }}</p>
    }
    <div class="flex items-center justify-between gap-2">
      <p class="text-sm text-orange-500">
        {{ product().price | currency: 'PEN' : 'S/ ' : '1.2-2' }}
      </p>
      <button (click)="add()" class="cursor-pointer rounded-2xl bg-neutral-50 p-2 text-neutral-900">
        <app-add-icon />
      </button>
    </div>
  </div>
</article>
