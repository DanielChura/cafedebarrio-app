<article class="w-full flex flex-col gap-2 rounded-2xl border border-neutral-200 p-4">
  <a [routerLink]="['/product', product().id]" class="block">
    @if (product().imageUrl) {
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        class="w-full aspect-square object-cover rounded-2xl bg-neutral-50"
      />
    } @else {
      <div class="w-full aspect-square rounded-2xl bg-neutral-50"></div>
    }
  </a>
  <div class="flex flex-col align-bottom gap-1">
    <p class="text-xs text-neutral-500 uppercase">{{ product().categoryName }}</p>
    <a [routerLink]="['/product', product().id]">
      <h3 class="text-base text-neutral-900 line-clamp-2">{{ product().name }}</h3>
    </a>
    <div class="flex flex-row gap-2 items-center">
      <div class="flex items-center gap-1">
        @for (star of stars; track star) {
          <app-star-icon
            [class]="
              'size-3 md:size-4 ' + (star <= filledStars() ? 'text-yellow-300' : 'text-neutral-300')
            "
          />
        }
      </div>
      <span class="text-xs text-neutral-500">({{ product().reviewCount ?? 0 }})</span>
    </div>

    <div class="flex items-center justify-between gap-2 mt-2">
      <p class="text-sm md:text-base text-neutral-900">
        {{ product().price | currency: 'PEN' : 'S/ ' : '1.2-2' }}
      </p>
      <button
        (click)="add()"
        aria-label="Add to cart"
        class="cursor-pointer rounded-2xl bg-green-800 p-2 text-white"
      >
        <app-add-icon class="size-4" />
      </button>
    </div>
  </div>
</article>
