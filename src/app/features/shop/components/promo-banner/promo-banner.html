<section class="bg-neutral-50 rounded-2xl p-8 flex flex-col items-start gap-2">
  <h2 class="text-2xl text-neutral-900">{{ title() }}</h2>
  <p class="text-sm text-neutral-500">{{ description() }}</p>
  <a [routerLink]="ctaLink()" class="text-sm text-white bg-orange-500 rounded-2xl px-4 py-2">{{
    ctaLabel()
  }}</a>
</section>
