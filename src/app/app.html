<div class="min-h-screen flex flex-col">
  @if (!isAuthPage) {
    <app-header />
  }
  @if (isAdminPage) {
    <div class="grow flex w-full flex-col">
      <router-outlet />
    </div>
  } @else {
    <div
      [class]="isAuthPage ? 'grow flex w-full flex-col' : 'grow mx-auto w-full max-w-6xl px-4 py-24'"
    >
      <router-outlet />
    </div>
  }
  @if (!isAuthPage) {
    <app-footer />
  }
</div>
