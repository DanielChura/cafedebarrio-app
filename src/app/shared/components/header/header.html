<header class="bg-white border-b border-neutral-200">
  <div class="mx-auto max-w-6xl px-4 py-4 flex items-center gap-6">
    <a routerLink="/" aria-label="Café de Barrio - inicio" class="shrink-0 text-lg text-neutral-900">Café de Barrio</a>
    <div role="search" class="mx-auto flex w-full max-w-md items-center gap-2 rounded-2xl bg-neutral-50 py-1 pl-4 pr-1">
      <input
        #searchBox
        id="site-search"
        name="q"
        type="search"
        autocomplete="off"
        placeholder="Buscar café, postres..."
        aria-label="Buscar café, postres..."
        (keydown.enter)="search(searchBox.value)"
        class="w-full bg-transparent text-sm text-neutral-900 placeholder:text-neutral-500 focus:outline-none"
      />
      <button
        type="button"
        (click)="search(searchBox.value)"
        aria-label="Buscar"
        class="cursor-pointer rounded-2xl bg-orange-500 p-2 text-white"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
      </button>
    </div>
    <div class="relative shrink-0" (keydown.escape)="closeMenu()">
      <button
        type="button"
        (click)="onAccountClick()"
        aria-label="Mi cuenta"
        aria-haspopup="menu"
        aria-controls="account-menu"
        [attr.aria-expanded]="menuOpen()"
        class="cursor-pointer text-neutral-500"
      >
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
        />
      </svg>
      </button>
      @if (menuOpen()) {
        <app-account-menu (closed)="closeMenu()" />
      }
    </div>
  </div>
</header>
