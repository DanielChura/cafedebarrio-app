<div
  id="account-menu"
  role="menu"
  aria-label="Órdenes y cuenta"
  class="absolute right-0 top-full mt-2 flex w-48 flex-col gap-1 rounded-2xl bg-neutral-50 p-2"
>
  <a
    routerLink="/my-orders"
    role="menuitem"
    (click)="closed.emit()"
    class="rounded-2xl px-4 py-2 text-sm text-neutral-900"
    >Mis pedidos</a
  >
  <button
    type="button"
    role="menuitem"
    (click)="logout()"
    class="cursor-pointer rounded-2xl px-4 py-2 text-left text-sm text-neutral-500"
  >
    Cerrar sesión
  </button>
</div>
