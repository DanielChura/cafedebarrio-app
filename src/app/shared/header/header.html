<header class="bg-white border-b border-neutral-200 fixed w-full z-40">
  <div class="mx-auto max-w-6xl px-4 py-3 flex items-center gap-4 md:gap-6">
    <a routerLink="/" class="flex shrink-0 cursor-pointer items-center gap-3 text-neutral-800">
      <app-logo-icon />
      <span class="hidden sm:inline text-sm text-green-800 font-medium">TechStore Pro</span>
    </a>
    <div
      class="mx-auto flex w-full max-w-md items-center gap-3 rounded-2xl bg-neutral-50 px-4 py-2"
    >
      <button
        (click)="search(searchBox.value)"
        aria-label="Search"
        class="cursor-pointer text-neutral-600"
      >
        <app-search-icon class="size-4 md:size-5" />
      </button>
      <input
        #searchBox
        placeholder="Search laptops, phones..."
        (keydown.enter)="search(searchBox.value)"
        class="w-full bg-transparent text-xs placeholder:text-neutral-600 focus:outline-none md:text-sm"
      />
    </div>
    <div class="flex shrink-0 items-center gap-4 md:gap-6">
      <a
        routerLink="/catalog"
        aria-label="Catalog"
        class="flex cursor-pointer items-center text-neutral-800"
      >
        <app-category-icon class="size-5 md:size-6" />
      </a>
      <a
        routerLink="/cart"
        aria-label="Cart"
        class="relative flex cursor-pointer items-center text-neutral-800"
      >
        <app-cart-icon class="size-5 md:size-6" />
        @if (cart.totalCount() > 0) {
          <span
            class="absolute -right-2 -top-2 rounded-full bg-green-600 px-1.5 py-0.5 text-[10px] text-white"
            >{{ cart.totalCount() }}</span
          >
        }
      </a>
      <div class="relative flex items-center">
        <button
          (click)="onAccountClick()"
          aria-label="Profile"
          class="flex cursor-pointer items-center text-neutral-800"
        >
          <app-user-icon class="size-5 md:size-6" />
        </button>
        @if (menuOpen()) {
          <app-account-menu class="contents" (closed)="closeMenu()" />
        }
      </div>
    </div>
  </div>
</header>
