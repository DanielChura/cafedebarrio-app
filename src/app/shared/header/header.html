<header class="bg-white border-b border-neutral-200 fixed w-full z-40">
  <div class="mx-auto max-w-6xl px-2 py-2 flex items-center gap-6">
    <a routerLink="/" aria-label="Café de Barrio - inicio" class="shrink-0 flex items-center">
      <img src="/logo.png" alt="Café de Barrio" class="h-14 w-auto object-contain" />
    </a>
    <div
      role="search"
      class="mx-auto flex w-full max-w-md items-center gap-2 rounded-2xl bg-neutral-50 py-1 pl-4 pr-1"
    >
      <input
        #searchBox
        id="site-search"
        name="q"
        type="search"
        autocomplete="off"
        placeholder="Buscar café, postres..."
        aria-label="Buscar café, postres..."
        (keydown.enter)="search(searchBox.value)"
        class="w-full bg-transparent text-sm focus:outline-none"
      />
      <button
        type="button"
        (click)="search(searchBox.value)"
        aria-label="Buscar"
        class="cursor-pointer rounded-2xl bg-orange-500 p-2 text-white"
      >
        <app-search-icon />
      </button>
    </div>
    <div class="flex shrink-0 items-center gap-6">
      <a routerLink="/cart" aria-label="Carrito" class="relative cursor-pointer text-neutral-500">
        <app-cart-icon />
        @if (cart.totalCount() > 0) {
          <span
            class="absolute -right-2 -top-2 rounded-full bg-orange-500 px-1 text-xs text-white"
            >{{ cart.totalCount() }}</span
          >
        }
      </a>
      <div class="relative" (keydown.escape)="closeMenu()">
        <button
          type="button"
          (click)="onAccountClick()"
          aria-label="Mi cuenta"
          aria-haspopup="menu"
          aria-controls="account-menu"
          [attr.aria-expanded]="menuOpen()"
          class="cursor-pointer text-neutral-500"
        >
          <app-user-icon />
        </button>
        @if (menuOpen()) {
          <app-account-menu (closed)="closeMenu()" />
        }
      </div>
    </div>
  </div>
</header>
