<div
  class="absolute right-0 top-full mt-2 flex w-48 flex-col gap-1 rounded-xl shadow-xl bg-white p-2 text-neutral-600"
>
  <a
    routerLink="/my-orders"
    (click)="closed.emit()"
    class="rounded-xl px-4 py-2 text-sm hover:text-neutral-800"
    >Mis pedidos</a
  >
  @if (isAdmin) {
    <a
      routerLink="/admin/productos"
      (click)="closed.emit()"
      class="rounded-xl px-4 py-2 text-sm hover:text-neutral-800"
      >Productos</a
    >
  }
  <button
    (click)="logout()"
    class="cursor-pointer rounded-xl px-4 py-2 text-left text-sm hover:text-neutral-800"
  >
    Cerrar sesión
  </button>
</div>
