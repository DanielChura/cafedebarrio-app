<div
  class="absolute right-0 top-full mt-2 flex w-52 flex-col gap-1 rounded-lg border border-neutral-200 bg-white p-2 text-neutral-500"
>
  <a
    routerLink="/me/orders"
    (click)="closed.emit()"
    class="rounded-lg px-4 py-2 text-sm text-neutral-900 hover:text-orange-500 hover:bg-neutral-100"
  >
    Mis órdenes
  </a>
  <a
    routerLink="/me/returns"
    (click)="closed.emit()"
    class="rounded-lg px-4 py-2 text-sm text-neutral-900 hover:text-orange-500 hover:bg-neutral-100"
  >
    Mis devoluciones
  </a>
  <a
    routerLink="/me/profile"
    (click)="closed.emit()"
    class="rounded-lg px-4 py-2 text-sm text-neutral-900 hover:text-orange-500 hover:bg-neutral-100"
  >
    Mi perfil
  </a>
  @if (isAdmin) {
    <a
      routerLink="/admin/productos"
      (click)="closed.emit()"
      class="rounded-lg px-4 py-2 text-sm text-neutral-900 hover:text-orange-500 hover:bg-neutral-100 border-t border-neutral-200"
    >
      Panel Admin
    </a>
  }
  <button
    type="button"
    (click)="logout()"
    class="cursor-pointer rounded-lg px-4 py-2 text-left text-sm text-neutral-500 hover:text-neutral-900 hover:bg-neutral-100 border-t border-neutral-200"
  >
    Cerrar sesión
  </button>
</div>
