<div
  class="absolute right-0 top-full mt-2 flex w-48 flex-col gap-1 rounded-2xl bg-white p-2 text-neutral-500"
>
  <a
    routerLink="/my-orders"
    (click)="closed.emit()"
    class="rounded-2xl px-4 py-2 text-sm hover:text-neutral-900"
    >Mis pedidos</a
  >
  @if (isAdmin) {
    <a
      routerLink="/admin/products"
      (click)="closed.emit()"
      class="rounded-2xl px-4 py-2 text-sm hover:text-neutral-900"
      >Productos</a
    >
  }
  <button
    (click)="logout()"
    class="cursor-pointer rounded-2xl px-4 py-2 text-left text-sm hover:text-neutral-900"
  >
    Cerrar sesión
  </button>
</div>
